services:
  # Tracking server + model registry. SQLite holds runs and the registry;
  # artifacts (the saved models) are served through the server, so clients
  # never need direct access to the artifact store.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"   # local only; view it through an SSH tunnel
    volumes:
      - ./mlruns:/mlflow
    restart: unless-stopped

  # Prediction API: serves whatever version holds the `production` alias and
  # follows the alias, so promote/rollback take effect without a restart.
  api:
    build: .
    command: ["uvicorn", "serve:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RELOAD_SECONDS: "30"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Scrapes the API every 15 s and evaluates the alert rules.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
    restart: unless-stopped

  # Dashboard, provisioned from monitoring/grafana. Anonymous read-only access
  # is fine because it only listens on localhost.
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/loan-default.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"   # 3000 is taken on the AWS server
    depends_on:
      - prometheus
    restart: unless-stopped

  # One-off jobs: training, registry commands and test traffic.
  trainer:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_SHA: ${GIT_SHA:-unknown}
      PROMOTED_BY: ${USER:-unknown}   # who moved the alias, for the audit trail
      API_URL: http://api:8000
    volumes:
      - ./src:/app/src
      - ./dataset:/app/dataset:ro
    depends_on:
      - mlflow
    profiles: ["jobs"]
