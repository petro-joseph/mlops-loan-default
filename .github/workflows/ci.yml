name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  model-quality:
    name: Model quality gate
    needs: test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///ci-mlflow.db   # throwaway registry; CI never touches the real one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train the candidate (train.py defaults)
        run: GIT_SHA=${GITHUB_SHA::7} python src/train.py --metrics-out metrics.json
      - name: Compare with the accepted baseline
        run: python src/check_quality.py metrics.json quality/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-metrics
          path: metrics.json

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    env:
      TF_WORKSPACE: staging   # validate the environment that exists, not "default"
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image:
    name: Build the service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loan-api:ci .
